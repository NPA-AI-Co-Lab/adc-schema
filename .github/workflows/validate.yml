name: Validate

# The release gate, run on every pull request and on every push to main.
# A schema that fails here cannot be merged, and therefore cannot be tagged.

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  validate:
    name: validate (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Validate schema and taxonomies
        run: npm run validate

      - name: Self-test the validator
        run: npm test

      - name: Check what the package would ship
        run: npm pack --dry-run
